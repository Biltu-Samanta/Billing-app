<!DOCTYPE html>
<html lang="bn">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>অশোক ফ্রুট শপ বিলিং</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body class="min-h-screen">
    <div
        class="max-w-[210mm] mx-auto bg-white p-4 md:p-8 shadow-xl my-4 print:shadow-none print:m-0 print:p-2 rounded-lg print:rounded-none">
        <!-- Header Section -->
        <div class="flex flex-wrap justify-between items-center gap-3 mb-4 no-print">
            <h1 class="text-xl font-bold text-gray-700">বিলিং সিস্টেম</h1>
            <div class="flex items-center gap-3">
                <button id="jpg-btn"
                    class="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2 rounded-lg transition-colors flex items-center gap-2 shadow-md font-bold text-sm">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2"
                            d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                    </svg>
                    JPG সেভ করুন
                </button>
                <button id="pdf-btn"
                    class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2 rounded-lg transition-colors flex items-center gap-2 shadow-md font-bold text-sm">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2"
                            d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                    </svg>
                    PDF সেভ করুন
                </button>
            </div>
        </div>

        <div class="text-center space-y-2 border-b-2 border-indigo-50 pb-4">
            <div class="group relative inline-block w-full">
                <input type="text" id="main-heading"
                    class="text-2xl md:text-3xl font-extrabold text-indigo-800 text-center w-full bg-transparent focus:outline-none focus:ring-2 focus:ring-indigo-200 rounded p-1 transition-all"
                    placeholder="দোকানের নাম" value="Ashok Fruit Shop">
                <div
                    class="absolute top-0 right-0 no-print opacity-0 group-hover:opacity-100 text-xs text-indigo-400 transition-opacity">
                    এডিট করতে ক্লিক করুন
                </div>
            </div>

            <div class="group relative inline-block w-full max-w-md">
                <input type="text" id="sub-heading"
                    class="text-lg md:text-xl text-gray-600 font-medium text-center w-full bg-transparent focus:outline-none focus:ring-2 focus:ring-indigo-100 rounded p-1 transition-all"
                    placeholder="উপ-শিরোনাম" value="RKM">
            </div>

            <div class="flex flex-wrap justify-center items-center gap-4 pt-2 text-gray-700">
                <div class="flex items-center gap-2">
                    <label class="font-bold whitespace-nowrap">শুরুর তারিখ:</label>
                    <input type="date" id="from-date"
                        class="border-2 border-gray-200 rounded-lg px-3 py-1.5 focus:border-indigo-500 focus:outline-none shadow-sm print:border-none">
                </div>
                <div class="flex items-center gap-2">
                    <label class="font-bold whitespace-nowrap">শেষের তারিখ:</label>
                    <input type="date" id="to-date"
                        class="border-2 border-gray-200 rounded-lg px-3 py-1.5 focus:border-indigo-500 focus:outline-none shadow-sm print:border-none">
                </div>
            </div>
        </div>

        <!-- Bill Table -->
        <div class="mt-4 overflow-x-auto">
            <table class="w-full border-collapse border-2 border-indigo-900 print:border-black">
                <thead>
                    <tr class="bg-indigo-900 text-white print:bg-gray-100 print:text-black">
                        <th class="border border-indigo-800 p-1 text-left w-24 print:border-black text-sm">তারিখ
                        </th>
                        <th class="border border-indigo-800 p-1 text-center print:border-black text-sm">পূজা ঘর
                        </th>
                        <th class="border border-indigo-800 p-1 text-center print:border-black text-sm">চা ঘর
                        </th>
                        <th
                            class="border border-indigo-800 p-1 text-center bg-indigo-800 print:bg-gray-200 print:border-black text-sm">
                            মোট</th>
                    </tr>
                </thead>
                <tbody id="bill-table-body">
                    <!-- Rows will be injected here via JS -->
                </tbody>
            </table>
        </div>

        <!-- Control buttons -->
        <div class="no-print mt-4 flex flex-wrap items-center justify-between gap-4">
            <div class="flex gap-4">
                <button id="add-row-btn"
                    class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded transition-colors text-sm font-bold shadow-sm">
                    + (Add Row)
                </button>
                <button id="remove-row-btn"
                    class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded transition-colors text-sm font-bold shadow-sm">
                    - (Remove Row)
                </button>
            </div>
            <div class="text-xs text-gray-500 flex flex-wrap items-center gap-3 bg-gray-50 px-3 py-1.5 rounded-lg border border-gray-200">
                <span class="font-semibold text-gray-600">কীবোর্ড নেভিগেশন:</span>
                <span><kbd class="px-1.5 py-0.5 bg-white border border-gray-300 rounded font-mono shadow-xs text-gray-700">Tab</kbd> কলাম পরিবর্তন</span>
                <span><kbd class="px-1.5 py-0.5 bg-white border border-gray-300 rounded font-mono shadow-xs text-gray-700">↓</kbd> / <kbd class="px-1.5 py-0.5 bg-white border border-gray-300 rounded font-mono shadow-xs text-gray-700">↑</kbd> সারি পরিবর্তন</span>
            </div>
        </div>

        <!-- Summary Section -->
        <div class="mt-4 space-y-4">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Puja Ghor Total Section -->
                <div class="space-y-3">
                    <div
                        class="bg-indigo-50 p-4 rounded-lg border border-indigo-100 flex justify-between items-center print:bg-white print:border-black print:p-2">
                        <span class="font-bold text-indigo-900 print:text-black">পূজা ঘর মোট:</span>
                        <span class="text-lg font-bold font-mono">₹<span id="puja-ghor-total">0.00</span></span>
                    </div>

                    <!-- Dynamic Extra Charges Section -->
                    <div class="space-y-2" id="extra-charges-container">
                        <!-- Extra charges injected here -->
                    </div>

                    <button id="add-extra-btn"
                        class="no-print w-full py-1.5 border-2 border-dashed border-indigo-200 text-indigo-500 hover:border-indigo-400 hover:text-indigo-600 rounded-lg text-sm font-bold transition-all flex justify-center items-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M12 4v16m8-8H4" />
                        </svg>
                        (Add Extra)
                    </button>
                </div>

                <!-- Cha Ghor Total Section -->
                <div
                    class="bg-indigo-50 p-4 rounded-lg border border-indigo-100 h-fit flex justify-between items-center print:bg-white print:border-black print:p-2">
                    <span class="font-bold text-indigo-900 print:text-black">চা ঘর মোট:</span>
                    <span class="text-lg font-bold font-mono">₹<span id="cha-ghor-total">0.00</span></span>
                </div>
            </div>

            <!-- Grand Total -->
            <div
                class="bg-indigo-600 text-white p-4 rounded-xl shadow-lg flex justify-between items-center print:bg-white print:text-black print:border-2 print:border-black print:shadow-none print:p-2">
                <div>
                    <span class="font-extrabold text-xl md:text-2xl block">সর্বমোট</span>
                    <span class="text-sm opacity-80 print:text-black print:font-bold uppercase tracking-wider">Grand
                        Total</span>
                </div>
                <span class="text-2xl md:text-3xl font-black font-mono">₹<span id="grand-total">0.00</span></span>
            </div>

            <!-- Signature Box -->
            <div class="mt-8 flex justify-end">
                <div class="flex flex-col items-center">
                    <div class="w-48 h-20 border-2 border-gray-200 rounded-md mb-2 print:border-black print:border-2">
                    </div>
                    <p class="font-bold text-gray-700 print:text-black text-sm">Signature</p>
                </div>
            </div>
        </div>

        <footer class="mt-8 pt-4 border-t border-gray-100 text-center text-xs text-gray-400 no-print">
            © <span id="current-year"></span> অশোক ফ্রুট শপ
        </footer>
    </div>
    <script src="script.js"></script>
</body>

</html>
